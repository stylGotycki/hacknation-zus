# Single entry point: the browser talks only to nginx on port 80,
# so frontend and API share one origin and no CORS setup is needed.
#
# URL translation: the Next.js app has English routes (/calculator), users see Polish
# URLs (/kalkulator). nginx translates in both directions:
#   public (Polish) URL   -> served by the English route   (internal proxy, URL unchanged)
#   English URL typed in  -> 301 redirect to the Polish URL (one canonical address per page)
#
# ROUTE TABLE: when adding a page, add one line to EACH of the two maps below and the
# matching entry in frontend/src/lib/nav.ts. `make check-routes` verifies they agree.

upstream frontend { server frontend:3000; }
upstream backend  { server backend:8000; }

# Polish public URL -> English route served by Next.js. Keeps sub-paths and query string.
map $request_uri $frontend_uri {
    ~^/kalkulator(?<rest>[/?].*)?$   /calculator$rest;
    ~^/kreator(?<rest>[/?].*)?$      /wizard$rest;
    ~^/os-czasu(?<rest>[/?].*)?$     /timeline$rest;
    ~^/wnioski(?<rest>[/?].*)?$      /applications$rest;
    ~^/przyklady(?<rest>[/?].*)?$    /examples$rest;
    ~^/dane-zus(?<rest>[/?].*)?$     /zus$rest;
    ~^/pomoc(?<rest>[/?].*)?$        /help$rest;
    ~^/logowanie(?<rest>[/?].*)?$    /login$rest;
    default                          $request_uri;
}

# English route typed or bookmarked -> canonical Polish URL (empty = no redirect).
map $request_uri $canonical_uri {
    ~^/calculator(?<rest>[/?].*)?$   /kalkulator$rest;
    ~^/wizard(?<rest>[/?].*)?$       /kreator$rest;
    ~^/timeline(?<rest>[/?].*)?$     /os-czasu$rest;
    ~^/applications(?<rest>[/?].*)?$ /wnioski$rest;
    ~^/examples(?<rest>[/?].*)?$     /przyklady$rest;
    ~^/zus(?<rest>[/?].*)?$          /dane-zus$rest;
    ~^/help(?<rest>[/?].*)?$         /pomoc$rest;
    ~^/login(?<rest>[/?].*)?$        /logowanie$rest;
    default                          "";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Relative `Location` headers: nginx listens on 80 inside the container, but the host port
    # may differ (HTTP_PORT=8080) or a TLS proxy may sit in front, so never emit a full URL.
    absolute_redirect off;

    # API (incl. /api/docs and /api/openapi.json). Path is passed unchanged:
    # FastAPI itself serves routes under /api. API paths stay English.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else goes to Next.js (assets, pages). Upgrade headers keep dev hot-reload
    # (websocket) working.
    location / {
        if ($canonical_uri) {
            return 301 $canonical_uri;
        }

        # Variable in proxy_pass: the URI is sent exactly as computed by $frontend_uri.
        proxy_pass http://frontend$frontend_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
